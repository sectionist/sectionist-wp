version: '3.8'

services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.1.4
    container_name: sectionist-wp-opencode
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/vendor
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    # Zwingt Docker dazu, NICHT OpenCode als Start-Programm zu nehmen, sondern die Shell
    entrypoint: ["sh", "/entrypoint.sh"]
    tty: true
    stdin_open: true
    security_opt:
      - no-new-privileges:true